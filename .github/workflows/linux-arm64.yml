name: Linux ARM64 build
on:
  push:
    branches: [build/linux-arm64]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-arm64-package
  cancel-in-progress: true
jobs:
  build:
    name: Test and package Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify privacy, TypeScript, notices and unit tests
        run: npm run verify:ci
      - name: Prove native ARM64 runner
        run: node -e "if(process.platform!=='linux'||process.arch!=='arm64')throw new Error('Expected Linux ARM64 runner')"
      - name: Package AppImage and DEB
        run: npm run dist:linux:arm64
      - name: Verify ARM64 packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          deb=release/Chat-On-Steroids-Linux-arm64.deb
          appimage=release/Chat-On-Steroids-Linux-arm64.AppImage
          test -s "$deb"
          test -s "$appimage"
          test -x "$appimage"
          test "$(dpkg-deb --field "$deb" Package)" = chat-on-steroids
          test "$(dpkg-deb --field "$deb" Architecture)" = arm64
          test "$(dpkg-deb --field "$deb" Version)" = "$(node -p "require('./package.json').version")"
          node scripts/smoke-packaged-runtime.mjs --platform linux --arch arm64
          (cd release && sha256sum Chat-On-Steroids-Linux-arm64.deb Chat-On-Steroids-Linux-arm64.AppImage > SHA256SUMS-linux-arm64.txt)
      - name: Install and smoke-test ARM64 DEB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$PWD/release/Chat-On-Steroids-Linux-arm64.deb" xvfb xauth
          test -L /usr/bin/chat-on-steroids
          ELECTRON_RUN_AS_NODE=1 /usr/bin/chat-on-steroids -e "if(process.platform!=='linux'||process.arch!=='arm64')process.exit(9); console.log('arm64-runtime-ok')" | grep -Fxq 'arm64-runtime-ok'
          node scripts/smoke-packaged-runtime.mjs --platform linux --arch arm64 --root "$(dirname "$(readlink -f /usr/bin/chat-on-steroids)")"
      - name: Launch ARM64 DEB GUI under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root" || true' EXIT
          mkdir -p "$smoke_root"/{home,config,cache,data,state}
          set +e
          HOME="$smoke_root/home" XDG_CONFIG_HOME="$smoke_root/config" XDG_CACHE_HOME="$smoke_root/cache" XDG_DATA_HOME="$smoke_root/data" XDG_STATE_HOME="$smoke_root/state" CLF_DEBUG=1 timeout --signal=TERM --kill-after=5s 12s xvfb-run -a /usr/bin/chat-on-steroids > arm64-gui.log 2>&1
          status=$?
          set -e
          cat arm64-gui.log
          test "$status" -eq 124
          grep -Fq '[info] app started' arm64-gui.log
          grep -Fq '[info] window loaded' arm64-gui.log
          grep -Fq '[info] renderer state ready' arm64-gui.log
          if grep -Eq '\[error\] (window failed to load|renderer:)' arm64-gui.log; then exit 1; fi
      - name: Upload Linux ARM64 installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-on-steroids-linux-arm64
          path: |
            release/Chat-On-Steroids-Linux-arm64.AppImage
            release/Chat-On-Steroids-Linux-arm64.deb
            release/SHA256SUMS-linux-arm64.txt
          if-no-files-found: error
          retention-days: 30
